services:
  - type: web
    name: ai-cyber-threat-analyzer
    env: python
    plan: free
    buildCommand: gcc -O3 -shared -fPIC -o threat_engine/c_threat_core.so threat_engine/c_threat_core.c 2>/dev/null || true; pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

